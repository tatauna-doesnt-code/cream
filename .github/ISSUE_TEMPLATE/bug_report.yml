name: Bug report
description: Report a reproducible CREAM problem
body:
  - type: markdown
    attributes:
      value: "Do not post GitHub tokens, private spreadsheets, or personal file paths. Report security issues through SECURITY.md."
  - type: input
    id: version
    attributes:
      label: CREAM version
    validations:
      required: true
  - type: input
    id: painter
    attributes:
      label: Painter version/build and Windows version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots (redact personal information)
