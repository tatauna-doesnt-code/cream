name: Publish CREAM release

on:
  push:
    branches: [main]
    paths:
      - kr7_batch/version.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cream-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install Pillow
      - name: Test exporter and updater
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build verified plugin package
        run: python scripts/build_release.py
      - name: Publish complete stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(python -c 'from kr7_batch.version import VERSION; print(VERSION)')"
          tag="v$version"
          if gh release view "$tag" --json isDraft > release-state.json 2>/dev/null; then
            draft="$(python -c 'import json; print(json.load(open("release-state.json"))["isDraft"])')"
            if [ "$draft" != "True" ]; then
              echo "Release $tag already published; leaving it unchanged."
              exit 0
            fi
            target="$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)"
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "Existing draft belongs to another commit; refusing to overwrite it."
              exit 1
            fi
          else
            python -c 'from pathlib import Path; from kr7_batch.version import VERSION; s=Path("CHANGELOG.md").read_text(encoding="utf-8"); body=s.split("## " + VERSION + "\n", 1)[1].split("\n## ", 1)[0].strip(); Path("release-notes.md").write_text(body + "\n\nInstalação manual: extraia CREAM-plugin.zip e execute Instalar.cmd com o Painter fechado.\nAtualizações: use Verificar atualizações no CREAM e reinicie o Painter após preparar a atualização.\n", encoding="utf-8")'
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "CREAM $version" --notes-file release-notes.md
          fi
          gh release upload "$tag" dist/CREAM-plugin.zip --clobber
          gh release edit "$tag" --draft=false --latest
